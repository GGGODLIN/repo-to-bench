[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-to-bench"
version = "0.1.0"
description = "A runner-neutral toolkit for safe patch evaluation artifacts"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GGGODLIN" }]
dependencies = []
classifiers = [
  "Operating System :: POSIX",
]

[project.optional-dependencies]
harbor = ["harbor==0.22.0"]

[project.scripts]
repo-to-bench = "repo_to_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

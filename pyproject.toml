[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-ledger"
version = "0.1.0"
description = "A runner-neutral toolkit for safe patch evaluation artifacts"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GGGODLIN" }]
dependencies = []
classifiers = [
  "Operating System :: POSIX",
]

[project.scripts]
patch-ledger = "patch_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

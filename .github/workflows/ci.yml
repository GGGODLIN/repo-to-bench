name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_CONFIG_FILE: /dev/null

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate home
        run: |
          echo "HOME=$RUNNER_TEMP/isolated-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/isolated-home"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Smoke installed CLI
        env:
          PYTHONPATH: ""
        run: |
          repo-to-bench --help
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as directory:
            root = pathlib.Path(directory)
            input_root = root / "input"
            run_root = root / "run"
            input_root.mkdir()
            (input_root / "hello.txt").write_text("hello\n", encoding="utf-8")
            manifest = root / "manifest.json"
            manifest.write_text(json.dumps({"source": "hello.txt"}), encoding="utf-8")
            result = subprocess.run(
              ["repo-to-bench", "stage", "--input-root", str(input_root), "--run-root", str(run_root), "--manifest", str(manifest)],
              capture_output=True,
              text=True,
              check=True,
            )
            assert json.loads(result.stdout)["status"] == "staged"
            assert (run_root / "staged" / "hello.txt").read_text(encoding="utf-8") == "hello\n"
          PY
      - name: Run no-cost tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run release safety scan
        env:
          PYTHONPATH: ""
        run: python scripts/release_scan.py

  harbor-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Isolate home
        run: |
          echo "HOME=$RUNNER_TEMP/isolated-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/isolated-home"
      - name: Install package with Harbor
        run: python -m pip install ".[harbor]"
      - name: Run no-cost Harbor E2E
        env:
          REPO_TO_BENCH_INSTALLED_E2E: "1"
        run: python -m unittest tests.harbor_e2e
